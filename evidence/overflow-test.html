<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:14px sans-serif;padding:1rem}</style>
</head>
<body>
<p id="result">Checking...</p>
<iframe id="f" src="../index.html" style="width:375px;height:800px;border:1px solid red" onload="check()"></iframe>
<script>
function check() {
  var f = document.getElementById('f');
  try {
    var sw = f.contentDocument.documentElement.scrollWidth;
    var cw = f.contentDocument.documentElement.clientWidth;
    document.getElementById('result').textContent =
      'scrollWidth=' + sw + ' clientWidth=' + cw + ' hasHorzOverflow=' + (sw > cw);
  } catch(e) {
    document.getElementById('result').textContent = 'Could not access frame: ' + e;
  }
}
</script>
</body></html>
